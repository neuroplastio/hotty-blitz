[package]
name = "hotty-blitz"
description = "A HOTTY host on Blitz: surfaces, patches, in-band resources, CPU rendering, and a C ABI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
hotty-wire.workspace = true
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true
# A link's url in click events (SPEC §9): the version Blitz already brings.
url = "2.5"
# Every frame of an animated GIF, APNG or WebP (anim.rs): Blitz decodes the
# first only. The version and formats Blitz already brings.
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
anyrender.workspace = true
anyrender_vello_cpu.workspace = true
# Colour emoji fonts are PNG bitmap glyphs (Noto Color Emoji's CBDT, Apple
# Color Emoji's sbix). anyrender_vello_cpu brings vello_cpu without `png`,
# and then every such glyph is dropped: an emoji drew blank. Only the feature
# is added here; the version is the one anyrender_vello_cpu already brings.
vello_cpu = { version = "0.1", default-features = false, features = ["png"] }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
keyboard-types = "0.7"
stylo_static_prefs = "0.21"
# Element states (focus, disabled), as Blitz keeps them: the version Blitz brings.
stylo_dom = "0.21"
# Computed styles (user-select, SPEC §11), as Blitz computes them: the version Blitz brings.
stylo = "0.21"
kurbo = "0.13.1"
peniko = "0.6"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[features]
# Blitz prints how long each resolve phase took (for profiling patches).
phase-times = ["blitz-dom/log-phase-times"]

[dev-dependencies]
# An APNG for the tests (`image` writes their GIFs).
png.workspace = true
