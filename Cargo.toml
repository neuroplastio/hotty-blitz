[workspace]
resolver = "3"
members = ["crates/hotty-blitz", "crates/hotty"]

[workspace.package]
version = "0.5.9"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/neuroplastio/hotty-blitz"

[workspace.dependencies]
# The hotty protocol: the Rust SDK's wire layer and its host side, pinned
# by commit until it is published (gov P-5). Without its terminal, which
# only programs need. To build against a checkout of hotty-rs beside this
# one: `cargo build --config 'patch."https://github.com/neuroplastio/hotty-rs".hotty.path="../hotty-rs/crates/hotty"'`.
hotty = { git = "https://github.com/neuroplastio/hotty-rs", rev = "995115dd7c6809321d7c14834c684630a60de4c1", default-features = false, features = ["zlib"] }
hotty-blitz = { path = "crates/hotty-blitz" }

# Blitz is pinned by commit. Upgrade in a leg of its own.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "e42ee1f2577f968e29ea148a75d2d4f0d2cf19cc", default-features = false, features = ["svg", "system-fonts", "floats", "woff"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "e42ee1f2577f968e29ea148a75d2d4f0d2cf19cc" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "e42ee1f2577f968e29ea148a75d2d4f0d2cf19cc", default-features = false, features = ["svg", "scrollbars"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "e42ee1f2577f968e29ea148a75d2d4f0d2cf19cc" }
# The version Blitz pins (its workspace), for the fonts a host ships (fonts.rs).
parley = { version = "0.12", default-features = false, features = ["std"] }
anyrender = "0.14.0"
anyrender_vello_cpu = { version = "0.18.0", default-features = false, features = ["filters", "multithreading"] }

base64 = "0.22"
unicode-segmentation = "1.13"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
png = "0.17"

# The Blitz fork (../blitz, branch `hotty`, made by scripts/blitz-fork.sh
# from the patches in mods/blitz/): construction, layout and rounding stop where a
# change stops, so a delta costs O(depth) instead of O(N).
[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "../blitz/packages/blitz-dom" }
blitz-html = { path = "../blitz/packages/blitz-html" }
blitz-paint = { path = "../blitz/packages/blitz-paint" }
blitz-traits = { path = "../blitz/packages/blitz-traits" }
debug_timer = { path = "../blitz/packages/debug_timer" }
stylo_taffy = { path = "../blitz/packages/stylo_taffy" }

# The parley fork (../parley, branch `hotty`, made by scripts/parley-fork.sh
# from the release Blitz pins and the patches in mods/parley/): a cluster with
# emoji presentation takes a colour font before a text font.
#
# The vello_cpu fork (../vello_cpu, branch `hotty`, made by
# scripts/vello-fork.sh from the published package and the patches in
# mods/vello_cpu/): flushing waits for the workers without spinning, a context
# takes at most 4 of them and one under 256 K px none, a blurred
# rectangle's inside is not worked out pixel by pixel, and a clip layer
# nothing is drawn in is not pushed.
[patch.crates-io]
parley = { path = "../parley/parley" }
fontique = { path = "../parley/fontique" }
parley_engine = { path = "../parley/parley_engine" }
parley_data = { path = "../parley/parley_data" }
parley_emoji = { path = "../parley/parley_emoji" }
vello_cpu = { path = "../vello_cpu" }

[profile.release]
lto = "thin"
debug = false
# Unwinding, so a panic inside a terminal (the C ABI) can be caught at the
# boundary instead of taking the terminal down with it.

[profile.bench]
inherits = "release"
